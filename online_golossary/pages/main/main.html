<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../assets/images/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="./styles/main.css">
    <title>Murlex</title>
</head>
<body>
    <header class="header-cont">
        <div class="header">
            <div class="logo-container">
                <div class="logo-icon">
                    <img src="../../assets/images/logo.png" alt="logo">
                </div>
                <span class="logo-text">Мурлекс</span>
            </div>
            <div class="nav-container">
                <a href="../about_us/intro.html" class="nav-link">О нас</a>
                <a href="#" class="info-button"><img src="../../assets/images/io.png" alt="i"></a>
            </div>
        </div>
    </header>
    <main class="main-cont">
        <div class="main">
            <div class="left-pannel">
                <h1 class="hero-title">Английский<br>словарь</h1>
                <p class="hero-subtitle">Лень — двигатель прогресса!</p>
                <p class="hero-description">Легко изучайте новые слова и расширяйте свой словарный запас!</p>

                <button class="create-btn">
                    <span>+ Создать</span>
                </button>
                <section class="features-grid">
                    <div class="feature-item">
                        <div class="feature-icon icon-search"><img src="../../assets/images/book.png" alt="book"></div>
                        <div class="feature-title">Быстрый<br>поиск</div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon icon-chart"><img src="../../assets/images/chart.png" alt="chart"></div>
                        <div class="feature-title">Удобное<br>обучение</div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon icon-heart"><img src="../../assets/images/like.png" alt="like"></div>
                        <div class="feature-title">Сохранение<br>любимых слов</div>
                    </div>
                </section>
            </div>
            <div class="right-pannel">
                <img src="../../assets/images/big-cat.png" alt="">
            </div>
        </div>
    </main>
    <footer class="footer-cont">
        <div class="footer">
            <span class="copyright-date">© 2026</span>
            <a href="../about_us/intro.html" class="about_us">DreamTeam</a>
        </div>
    </footer>
</body>
</html>
